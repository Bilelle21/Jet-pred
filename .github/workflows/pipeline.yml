name: Train, evaluate and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ton-pseudo/jetpred-api

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache dataset
        uses: actions/cache@v4
        with:
          path: data
          key: openml-hls4ml-v1

      - name: Train
        run: uv run python -m jetpred_mlops.train

      - name: Evaluate and register (quality gate)
        run: uv run python -m jetpred_mlops.evaluate

      - name: Model behaviour tests
        run: uv run pytest -m model -v

      - name: Export champion model
        run: uv run python scripts/export_model.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-smoke-test:
    needs: train-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: jetpred

      - name: Load image into the cluster
        run: |
          docker pull $IMAGE:${{ github.sha }}
          kind load docker-image $IMAGE:${{ github.sha }} --name jetpred

      - name: Deploy
        run: |
          kubectl apply -f k8s/service.yaml
          sed "s|image: .*|image: $IMAGE:${{ github.sha }}|" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/jetpred-api --timeout=180s

      - name: Smoke test
        run: |
          kubectl port-forward service/jetpred-api 8000:80 &
          sleep 5
          curl --fail http://localhost:8000/ready
          curl --fail -X POST http://localhost:8000/predict \
               -H "Content-Type: application/json" \
               -d @tests/fixtures/sample_request.json