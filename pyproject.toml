[project]
name = "jetpred"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bilelle", email = "bilelletriki88@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jetpred = "jetpred:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]


[tool.pytest.ini_options]
markers = ["model: tests that need a registered champion model"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
