apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jetpred-api-alerts
spec:
  groups:
    - name: jetpred-api
      rules:
        - alert: JetpredHighErrorRate
          expr: |
            sum(rate(jetpred_http_requests_total{path="/predict", status=~"5.."}[5m]))
              / sum(rate(jetpred_http_requests_total{path="/predict"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of prediction requests fail with a server error

        - alert: JetpredHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(jetpred_http_request_duration_seconds_bucket{path="/predict"}[5m]))
            ) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: p95 prediction latency above 100 ms